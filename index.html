<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cinematic Authentication Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap');
        :root{--primary-text:#08111a;--secondary-text:#5a6e82;--highlight:#2a75d3;--bg-center:#fff;--bg-edge:#cdd6de;--ui-font:'Montserrat',sans-serif;--transition-speed:.4s}
        *{margin:0;padding:0;box-sizing:border-box;user-select:none}
        html,body{width:100%;height:100%;overflow:hidden;background:#fff;font-family:var(--ui-font);color:var(--primary-text)}
        #environment{position:absolute;top:-5%;left:-5%;width:110%;height:110%;background:radial-gradient(circle at 50% 50%,var(--bg-center),var(--bg-edge));z-index:1;display:flex;justify-content:center;align-items:center;will-change:transform}
        .light-pillars{position:absolute;width:100%;height:100%;background-image:repeating-linear-gradient(90deg,transparent 0%,transparent 8%,rgba(255,255,255,.7) 8.5%,#fff 10%,rgba(255,255,255,.7) 11.5%,transparent 12%);filter:blur(12px);opacity:.85}
        #character-layer{position:absolute;inset:0;z-index:2;display:flex;justify-content:center;align-items:flex-end;will-change:transform;pointer-events:none}
        .character-model{height:100vh;max-width:none;object-fit:cover;object-position:top center;filter:contrast(1.02) brightness(1.05) saturate(.65) hue-rotate(190deg) drop-shadow(0 0 50px rgba(255,255,255,.9));transform-origin:bottom center;animation:breathe 7s ease-in-out infinite alternate;mask-image:linear-gradient(to top,transparent 0%,transparent 15%,#000 40%,#000 100%);-webkit-mask-image:linear-gradient(to top,transparent 0%,transparent 15%,#000 40%,#000 100%)}
        @keyframes breathe{0%{transform:scale(1) translateY(0)}100%{transform:scale(1.01) translateY(-3px)}}
        #atmosphere{position:absolute;inset:0;z-index:3;background:radial-gradient(circle at 50% 60%,transparent 35%,rgba(205,214,222,.5) 100%);box-shadow:inset 0 0 120px rgba(255,255,255,.6);pointer-events:none}
        #ui-layer{position:absolute;bottom:20%;width:100%;z-index:10;display:flex;flex-direction:column;align-items:center;will-change:transform}
        .menu-track{position:absolute;top:50%;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(8,17,26,.15) 20%,rgba(8,17,26,.15) 80%,transparent);z-index:-1;transform:translateY(-50%)}
        .nav-container{display:flex;align-items:center;gap:2.5rem;position:relative}.separator{width:4px;height:4px;background:var(--primary-text);opacity:.3;transform:rotate(45deg)}
        .menu-item{position:relative;display:flex;align-items:center;cursor:pointer;padding:.5rem 1rem;transition:all var(--transition-speed) ease}
        .bracket{opacity:0;font-weight:300;font-size:1.2rem;color:var(--primary-text);transition:all var(--transition-speed) ease;position:absolute}.bracket.left{left:-5px;transform:translateX(10px)}.bracket.right{right:-5px;transform:translateX(-10px)}
        .active-indicator{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:0;height:1px;background:var(--primary-text);transition:width var(--transition-speed) ease}
        .active-triangle{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:4px solid var(--primary-text);opacity:0;transition:opacity var(--transition-speed) ease}
        .cinematic-input{background:transparent;border:0;outline:0;font-family:var(--ui-font);font-size:.85rem;font-weight:400;letter-spacing:.25em;color:var(--primary-text);text-transform:uppercase;text-align:center;width:140px;transition:width var(--transition-speed) ease,color var(--transition-speed) ease;caret-color:var(--primary-text)}
        .cinematic-input::placeholder{color:var(--secondary-text);opacity:.8;transition:opacity var(--transition-speed) ease}.menu-item:hover .cinematic-input::placeholder{opacity:1;color:var(--primary-text)}
        .menu-item.focused .bracket,.menu-item.has-value .bracket{opacity:1;transform:translateX(0)}.menu-item.focused .active-indicator,.menu-item.has-value .active-indicator{width:100%}.menu-item.focused .active-triangle{opacity:1}.menu-item.focused .cinematic-input{width:180px}
        .cinematic-btn{background:transparent;border:0;outline:0;font-family:var(--ui-font);font-size:.85rem;font-weight:400;letter-spacing:.25em;color:var(--secondary-text);cursor:pointer;text-transform:uppercase;transition:color var(--transition-speed) ease}.menu-item:hover .cinematic-btn,.menu-item.focused .cinematic-btn{color:var(--primary-text);font-weight:400}
        .loading-ring{position:absolute;top:25px;right:45px;width:20px;height:20px;border:1px solid rgba(8,17,26,.15);border-top:1px solid var(--primary-text);border-radius:50%;animation:spin 1s linear infinite;opacity:0;transition:opacity .5s ease}@keyframes spin{to{transform:rotate(360deg)}}
        .status-message{position:absolute;bottom:-35px;font-size:.7rem;letter-spacing:.3em;color:var(--primary-text);opacity:0;transform:translateY(10px);transition:all .5s ease}
        #cinematic-flash{position:absolute;inset:0;background:#fff;z-index:999;opacity:0;pointer-events:none;mix-blend-mode:overlay}.system-authenticated #cinematic-flash{animation:flash-glitch 2s forwards}.system-authenticated #ui-layer{opacity:0;filter:blur(10px);transition:all 1.5s cubic-bezier(.19,1,.22,1)}@keyframes flash-glitch{0%{opacity:0}5%{opacity:1}10%{opacity:0}15%{opacity:.8}20%,100%{opacity:0}}
        @media(max-width:800px){.nav-container{flex-direction:column;gap:2rem}.separator{display:none}.menu-track{display:none}.character-model{height:90vh}#ui-layer{bottom:15%}.cinematic-input{font-size:1rem;width:180px}.menu-item.focused .cinematic-input{width:200px}.cinematic-btn{font-size:1rem}}
    </style>
</head>
<body>
<div id="environment" class="parallax-target" data-depth="0.02"><div class="light-pillars"></div></div>
<div id="character-layer" class="parallax-target" data-depth="0.05"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1500&auto=format&fit=crop" alt="Original Character Model" class="character-model" draggable="false"></div>
<div id="atmosphere"></div><div id="global-loader" class="loading-ring"></div>
<div id="ui-layer" class="parallax-target" data-depth="0.01"><div class="menu-track"></div><div class="nav-container">
<div class="menu-item" id="item-username"><span class="bracket left">[</span><input type="text" id="username" class="cinematic-input" placeholder="OPERATIVE ID" autocomplete="off" spellcheck="false"><span class="bracket right">]</span><div class="active-indicator"></div><div class="active-triangle"></div></div>
<div class="separator"></div>
<div class="menu-item" id="item-password"><span class="bracket left">[</span><input type="password" id="password" class="cinematic-input" placeholder="ACCESS CODE" autocomplete="new-password"><span class="bracket right">]</span><div class="active-indicator"></div><div class="active-triangle"></div></div>
<div class="separator"></div>
<div class="menu-item" id="item-submit" tabindex="0"><span class="bracket left">[</span><button id="btn-continue" class="cinematic-btn">CONTINUE</button><span class="bracket right">]</span><div class="active-indicator"></div><div class="active-triangle"></div></div>
</div><div id="status-text" class="status-message">AWAITING INPUT</div></div>
<div id="cinematic-flash"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const inputs=document.querySelectorAll('.cinematic-input'),menuItems=document.querySelectorAll('.menu-item'),submitBtn=document.getElementById('btn-continue'),submitItem=document.getElementById('item-submit'),statusText=document.getElementById('status-text'),globalLoader=document.getElementById('global-loader'),body=document.body;
inputs.forEach(input=>{const parent=input.closest('.menu-item');input.addEventListener('focus',()=>{menuItems.forEach(item=>item.classList.remove('focused'));parent.classList.add('focused')});input.addEventListener('blur',()=>{parent.classList.remove('focused');input.value.trim().length?parent.classList.add('has-value'):parent.classList.remove('has-value')})});
submitItem.addEventListener('mouseenter',()=>submitItem.classList.add('focused'));submitItem.addEventListener('mouseleave',()=>submitItem.classList.remove('focused'));submitItem.addEventListener('focus',()=>submitItem.classList.add('focused'));submitItem.addEventListener('blur',()=>submitItem.classList.remove('focused'));
const targets=document.querySelectorAll('.parallax-target');let mouseX=0,mouseY=0,currentX=0,currentY=0;document.addEventListener('mousemove',e=>{mouseX=(e.clientX/innerWidth-.5)*2;mouseY=(e.clientY/innerHeight-.5)*2});function render(){currentX+=(mouseX-currentX)*.05;currentY+=(mouseY-currentY)*.05;targets.forEach(t=>{const d=parseFloat(t.dataset.depth),x=currentX*(innerWidth*d),y=currentY*(innerHeight*d);t.style.transform=`translate(${x}px,${y}px)`});requestAnimationFrame(render)}render();
function auth(){const u=document.getElementById('username').value,p=document.getElementById('password').value;if(!u||!p){statusText.textContent='ERR: CREDENTIALS REQUIRED';statusText.style.opacity='1';statusText.style.color='#a32a2a';setTimeout(()=>statusText.style.opacity='0',2000);return}globalLoader.style.opacity='1';statusText.textContent='VERIFYING IDENTITY...';statusText.style.color='var(--primary-text)';statusText.style.opacity='1';statusText.style.transform='translateY(0)';inputs.forEach(i=>i.disabled=true);submitBtn.disabled=true;setTimeout(()=>{globalLoader.style.opacity='0';statusText.textContent='ACCESS GRANTED';statusText.style.letterSpacing='.5em';setTimeout(()=>body.classList.add('system-authenticated'),400)},1800)}
submitBtn.addEventListener('click',auth);document.addEventListener('keydown',e=>{if(e.key==='Enter')auth()});
});
</script>
</body>
</html>
