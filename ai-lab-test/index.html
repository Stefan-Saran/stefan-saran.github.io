<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="AI Lab Test — autonomous development and QA demonstration." />
    <title>AI Lab Test</title>
    <style>
:root {
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --bg: #f5f7fb;
  --surface: rgba(255,255,255,.86);
  --surface-strong: #ffffff;
  --text: #111827;
  --muted: #687386;
  --line: #e5e9f0;
  --accent: #5b5cf0;
  --accent-2: #7c3aed;
  --accent-soft: #eef0ff;
  --success: #16845b;
  --success-soft: #eaf8f1;
  --danger: #c24141;
  --danger-soft: #fff0f0;
  --shadow: 0 18px 50px rgba(26, 35, 60, .08);
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #0b0e14;
  --surface: rgba(18,22,31,.88);
  --surface-strong: #121720;
  --text: #f1f5f9;
  --muted: #99a3b4;
  --line: #242b38;
  --accent: #8b8cff;
  --accent-2: #a78bfa;
  --accent-soft: #20213d;
  --success: #40c88b;
  --success-soft: #122a22;
  --danger: #ff8585;
  --danger-soft: #34191d;
  --shadow: 0 18px 60px rgba(0,0,0,.32);
}
* { box-sizing: border-box; }
html { min-width: 320px; scroll-behavior: smooth; }
body { margin: 0; background: radial-gradient(circle at top, rgba(91,92,240,.07), transparent 28rem), var(--bg); color: var(--text); }
button, input { font: inherit; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; }
button:disabled { cursor: wait; opacity: .65; }
.app-shell { min-height: 100vh; display:flex; flex-direction:column; }
.container { width: min(1120px, calc(100% - 36px)); margin: 0 auto; }
.topbar { position: sticky; top:0; z-index:10; backdrop-filter: blur(18px); background: color-mix(in srgb, var(--bg) 84%, transparent); border-bottom:1px solid color-mix(in srgb, var(--line) 82%, transparent); }
.nav-wrap { height:72px; display:flex; align-items:center; gap:18px; }
.brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.03em; margin-right:16px; }
.brand-mark { display:grid; place-items:center; width:34px; height:34px; border-radius:10px; color:white; background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:0 7px 20px rgba(91,92,240,.25); font-size:12px; }
.nav-links { display:flex; gap:4px; flex:1; }
.nav-links a { padding:9px 12px; border-radius:10px; color:var(--muted); font-size:14px; }
.nav-links a:hover, .nav-links a.active { color:var(--text); background:var(--surface-strong); }
.icon-button { margin-left:auto; width:40px; height:40px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--text); }
.main-content { flex:1; padding:54px 0 72px; }
.page-stack { display:flex; flex-direction:column; gap:28px; }
.hero { padding:58px 0 26px; max-width:860px; }
.eyebrow, .section-label { color:var(--accent); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.12em; }
.eyebrow { display:flex; align-items:center; gap:8px; margin-bottom:18px; }
.status-dot { width:8px; height:8px; border-radius:999px; background:#32c48d; box-shadow:0 0 0 5px rgba(50,196,141,.12); }
h1 { margin:0; font-size:clamp(42px,7vw,76px); line-height:.98; letter-spacing:-.055em; }
.hero h1 span { color:var(--accent); }
.hero-copy, .page-header p { color:var(--muted); font-size:18px; line-height:1.65; max-width:720px; margin:22px 0 0; }
.hero-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:30px; }
.button { border:1px solid var(--line); border-radius:12px; min-height:44px; padding:0 16px; font-weight:750; color:var(--text); background:var(--surface-strong); transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
.button:hover { transform:translateY(-1px); box-shadow:0 10px 28px rgba(20,30,50,.08); }
.button.primary { color:#fff; border-color:transparent; background:linear-gradient(135deg,var(--accent),var(--accent-2)); }
.button.ghost { background:var(--surface); }
.button.dark { background:#111827; color:#fff; border-color:#111827; }
:root[data-theme='dark'] .button.dark { background:#f6f7fb; color:#111827; border-color:#f6f7fb; }
.hero-meta { display:flex; flex-wrap:wrap; gap:10px; color:var(--muted); font-size:13px; margin-top:26px; }
.feature-grid, .stat-grid, .about-grid { display:grid; gap:16px; }
.feature-grid { grid-template-columns:repeat(3,1fr); }
.feature-card, .stat-card, .panel, .callout { border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
.feature-card { border-radius:18px; padding:24px; }
.feature-icon { width:40px; height:40px; display:grid; place-items:center; border-radius:12px; background:var(--accent-soft); color:var(--accent); font-weight:800; }
.feature-card h3 { margin:19px 0 8px; font-size:17px; }
.feature-card p { margin:0; color:var(--muted); line-height:1.65; font-size:14px; }
.callout { border-radius:18px; padding:20px 22px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
.callout strong, .callout span { display:block; }
.callout strong { font-size:15px; }
.callout span { color:var(--muted); font-size:13px; margin-top:4px; }
.page-header { padding:10px 0 8px; }
.page-header h1 { font-size:clamp(38px,5vw,58px); margin-top:4px; }
.dashboard-actions { display:flex; justify-content:space-between; align-items:center; gap:14px; }
.pill, .score-chip { display:inline-flex; align-items:center; gap:8px; padding:8px 11px; border-radius:999px; font-size:12px; font-weight:800; }
.pill { color:var(--success); background:var(--success-soft); }
.score-chip.good { color:var(--success); background:var(--success-soft); }
.score-chip.bad { color:var(--danger); background:var(--danger-soft); }
.stat-grid { grid-template-columns:repeat(4,1fr); }
.stat-card { border-radius:16px; padding:19px 20px; }
.stat-card > span, .stat-card > small { display:block; color:var(--muted); }
.stat-card > span { font-size:12px; font-weight:700; }
.stat-card strong { display:block; font-size:28px; letter-spacing:-.03em; margin:12px 0 4px; }
.stat-card small { font-size:12px; line-height:1.45; }
.panel { border-radius:18px; padding:24px; }
.panel.compact { padding-bottom:10px; }
.panel-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:18px; }
.panel-heading h2 { margin:0; font-size:20px; letter-spacing:-.025em; }
.panel-heading p { margin:5px 0 0; color:var(--muted); font-size:13px; }
.results-list { display:flex; flex-direction:column; }
.result-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:15px 0; border-top:1px solid var(--line); }
.result-row:first-child { border-top:0; }
.result-title { font-size:14px; font-weight:750; }
.result-detail { margin-top:4px; color:var(--muted); font-size:12px; }
.result-badge { flex:none; min-width:58px; text-align:center; padding:6px 9px; border-radius:999px; font-size:11px; font-weight:900; }
.result-badge.pass { color:var(--success); background:var(--success-soft); }
.result-badge.fail { color:var(--danger); background:var(--danger-soft); }
.history-list { display:flex; flex-direction:column; }
.history-row { display:grid; grid-template-columns:1fr auto 70px; gap:12px; padding:12px 0; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
.history-row strong { color:var(--text); text-align:right; }
.text-button { border:0; background:none; color:var(--accent); font-weight:800; padding:0; }
.small-link { text-align:right; }
.test-layout { display:grid; grid-template-columns:minmax(0,1.02fr) minmax(360px,.98fr); gap:18px; }
.test-controls, .test-runner { min-height:100%; }
.control-section { padding:0 0 26px; margin-bottom:26px; border-bottom:1px solid var(--line); }
.control-section:last-child { margin:0; padding:0; border:0; }
.counter-display { font-size:70px; font-weight:850; line-height:1; letter-spacing:-.06em; margin:14px 0 18px; }
.counter-actions { display:flex; flex-wrap:wrap; gap:9px; }
.field-label { display:block; margin:14px 0 7px; font-size:13px; font-weight:700; }
.text-input { width:100%; height:46px; padding:0 13px; border-radius:11px; border:1px solid var(--line); background:var(--surface-strong); color:var(--text); outline:none; }
.text-input:focus { border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent); }
.input-preview { margin-top:12px; border-radius:11px; padding:13px; background:color-mix(in srgb, var(--surface-strong) 78%, var(--accent-soft)); }
.input-preview span { display:block; color:var(--muted); font-size:11px; margin-bottom:4px; }
.input-preview strong { font-size:14px; overflow-wrap:anywhere; }
.theme-control { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.theme-control p, .reset-strip p { margin:7px 0 0; color:var(--muted); font-size:13px; }
.reset-strip { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.test-status-banner { display:flex; justify-content:space-between; align-items:center; gap:12px; border-radius:12px; padding:12px 14px; background:var(--success-soft); color:var(--success); font-weight:800; font-size:13px; margin-bottom:4px; }
.about-grid { grid-template-columns:repeat(2,1fr); }
.prose h2 { font-size:20px; margin:0 0 10px; }
.prose h2:not(:first-child) { margin-top:26px; }
.prose p { color:var(--muted); line-height:1.72; font-size:14px; }
.tech-tags { display:flex; flex-wrap:wrap; gap:8px; }
.tech-tags span { border:1px solid var(--line); background:var(--surface-strong); padding:8px 10px; border-radius:999px; color:var(--muted); font-size:12px; }
footer { border-top:1px solid var(--line); }
.footer-wrap { min-height:88px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
.footer-wrap > div:first-child span { display:block; color:var(--muted); font-size:12px; margin-top:4px; }
.footer-wrap > div:last-child { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; }
.footer-wrap a:hover { color:var(--text); }
.footer-dot { opacity:.5; }
@media (max-width: 900px) { .feature-grid, .stat-grid { grid-template-columns:repeat(2,1fr); } .test-layout { grid-template-columns:1fr; } }
@media (max-width: 700px) {
  .container { width:min(100% - 24px, 1120px); }
  .nav-wrap { height:64px; }
  .nav-links a { padding:8px 8px; font-size:13px; }
  .brand { margin-right:0; }
  .brand > span:last-child { display:none; }
  .hero { padding-top:28px; }
  h1 { font-size:46px; }
  .hero-copy, .page-header p { font-size:16px; }
  .feature-grid, .stat-grid, .about-grid { grid-template-columns:1fr; }
  .callout, .dashboard-actions, .theme-control, .reset-strip, .footer-wrap { align-items:flex-start; flex-direction:column; }
  .footer-wrap { padding:18px 0; }
  .footer-wrap > div:last-child { align-items:flex-start; flex-wrap:wrap; }
  .panel-heading { flex-direction:column; }
  .panel-heading .button { width:100%; }
  .counter-actions .button { flex:1 1 90px; }
}
@media (max-width: 460px) {
  .nav-links { overflow:auto; scrollbar-width:none; }
  .nav-links::-webkit-scrollbar { display:none; }
  .nav-links a { white-space:nowrap; }
  .icon-button { flex:none; }
  .main-content { padding-top:30px; }
  .result-row { align-items:flex-start; }
  .result-detail { max-width:220px; }
  .history-row { grid-template-columns:1fr auto; }
  .history-row strong { grid-column:2; grid-row:1; }
}

</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
"use strict";
const STORAGE = { counter: 'ai-lab-counter', text: 'ai-lab-text', theme: 'ai-lab-theme', runs: 'ai-lab-test-runs' };
const storage = (() => {
    const injected = window.__AI_LAB_TEST_STORAGE__;
    if (injected)
        return injected;
    try {
        const native = window.localStorage;
        const probe = '__ai_lab_storage_probe__';
        native.setItem(probe, '1');
        native.removeItem(probe);
        return native;
    }
    catch {
        const data = new Map();
        return {
            getItem: (key) => data.get(key) ?? null,
            setItem: (key, value) => { data.set(key, String(value)); },
            removeItem: (key) => { data.delete(key); },
            clear: () => data.clear()
        };
    }
})();
const TESTS = [
    { id: 'load', name: 'Application loads' },
    { id: 'increment', name: 'Counter increments' },
    { id: 'decrement', name: 'Counter decrements' },
    { id: 'reset', name: 'Counter resets' },
    { id: 'text', name: 'Text input works' },
    { id: 'theme', name: 'Theme toggle works' },
    { id: 'storage', name: 'localStorage persistence' },
    { id: 'navigation', name: 'Navigation works' }
];
const root = document.querySelector('#root');
let route = routeFromHash();
let theme = readTheme();
let counter = readNumber(STORAGE.counter);
let text = storage.getItem(STORAGE.text) ?? '';
let results = readRuns()[0]?.results ?? [];
let runs = readRuns();
let running = false;
function readNumber(key) {
    const value = Number.parseInt(storage.getItem(key) ?? '', 10);
    return Number.isFinite(value) ? value : 0;
}
function readTheme() { return storage.getItem(STORAGE.theme) === 'dark' ? 'dark' : 'light'; }
function readRuns() { try {
    const parsed = JSON.parse(storage.getItem(STORAGE.runs) ?? '[]');
    return Array.isArray(parsed) ? parsed : [];
}
catch {
    return [];
} }
function persist() {
    storage.setItem(STORAGE.counter, String(counter));
    storage.setItem(STORAGE.text, text);
    storage.setItem(STORAGE.theme, theme);
}
function routeFromHash() { const value = window.location.hash.replace(/^#/, ''); return ['dashboard', 'test', 'about'].includes(value) ? value : 'home'; }
function navigate(next) { window.location.hash = next === 'home' ? '' : next; }
function setState(next) { next(); persist(); render(); }
function formatDate(value) { return new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(value)); }
function resultRows(list) {
    if (!list.length)
        return `<div class="empty-state">No test run yet. Run the suite to populate real results.</div>`;
    return list.map(result => `<div class="result-row"><div><div class="result-title">${escapeHtml(result.name)}</div><div class="result-detail">${escapeHtml(result.detail)}</div></div><span class="result-badge ${result.status === 'PASS' ? 'pass' : 'fail'}">${result.status}</span></div>`).join('');
}
function escapeHtml(value) { return value.replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c] ?? c)); }
function stats() { const passed = results.filter(r => r.status === 'PASS').length; const failed = results.filter(r => r.status === 'FAIL').length; return { passed, failed, score: results.length ? Math.round(passed / results.length * 100) : 0 }; }
function header() {
    const links = [['home', 'Home'], ['dashboard', 'Dashboard'], ['test', 'Test'], ['about', 'About']];
    return `<header class="topbar"><div class="container nav-wrap"><a class="brand" href="#" data-route="home"><span class="brand-mark">AI</span><span>AI Lab Test</span></a><nav class="nav-links" aria-label="Primary">${links.map(([value, label]) => `<a href="${value === 'home' ? '#' : '#' + value}" data-route="${value}" class="${route === value ? 'active' : ''}">${label}</a>`).join('')}</nav><button class="icon-button" data-action="theme" aria-label="Switch to ${theme === 'dark' ? 'light' : 'dark'} mode">${theme === 'dark' ? '☀' : '☾'}</button></div></header>`;
}
function footer() { return `<footer><div class="container footer-wrap"><div><strong>AI Lab Test</strong><span>Autonomous web-development demonstration</span></div><div><button class="text-button" data-route="about">About</button><span class="footer-dot">•</span><a href="https://vite.dev" target="_blank" rel="noreferrer">Built with TypeScript</a></div></div></footer>`; }
function pageHeader(eyebrow, title, subtitle) { return `<div class="page-header"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div>`; }
function home() { return `<section class="container page-stack"><div class="hero"><div class="eyebrow"><span class="status-dot"></span> Autonomous QA playground</div><h1>Build. Test. Inspect.<br><span>Ship with confidence.</span></h1><p class="hero-copy">AI Lab Test is a small, production-shaped web app designed to demonstrate autonomous implementation, browser testing, persistence, and visual QA.</p><div class="hero-actions"><button class="button primary" data-route="test">Start Test <span>→</span></button><button class="button ghost" data-route="dashboard">Open Dashboard</button></div><div class="hero-meta"><span>TypeScript</span><span>·</span><span>Local-first</span><span>·</span><span>Browser verified</span></div></div><div class="feature-grid"><article class="feature-card"><div class="feature-icon">◈</div><h3>Interactive checks</h3><p>Run real client-side checks against the core UI instead of hard-coded demo results.</p></article><article class="feature-card"><div class="feature-icon">↻</div><h3>Persistent state</h3><p>Counter values, text, theme preference, and recent test runs survive refreshes via localStorage.</p></article><article class="feature-card"><div class="feature-icon">◫</div><h3>Responsive by design</h3><p>A compact dashboard and testing surface adapt from desktop to narrow mobile screens.</p></article></div><div class="callout"><div><strong>Ready to inspect the system?</strong><span>Run the full suite and review each check.</span></div><button class="button dark" data-route="dashboard">View results →</button></div></section>`; }
function dashboard() { const s = stats(); const lastRun = runs[0]; return `<section class="container page-stack">${pageHeader('System overview', 'Dashboard', 'A live snapshot of the latest client-side test run.')}<div class="dashboard-actions"><div><span class="pill"><span class="status-dot"></span> ${s.failed === 0 && results.length ? 'Healthy' : results.length ? 'Needs attention' : 'Not run'}</span></div><button class="button primary" data-action="run-all" ${running ? 'disabled' : ''}>${running ? 'Running…' : 'Run All Tests'}</button></div><div class="stat-grid"><div class="stat-card"><span>Current score</span><strong>${results.length ? `${s.score}%` : '—'}</strong><small>${results.length ? (s.failed === 0 ? 'All checks passed' : `${s.failed} failed`) : 'Run the suite to measure'}</small></div><div class="stat-card"><span>Completed tests</span><strong>${results.length ? s.passed : '—'}</strong><small>Passing checks in latest run</small></div><div class="stat-card"><span>Failed tests</span><strong>${results.length ? s.failed : '—'}</strong><small>${results.length ? (s.failed ? 'Review test details' : 'No failures recorded') : 'No failures recorded'}</small></div><div class="stat-card"><span>Last test time</span><strong class="stat-date">${lastRun ? formatDate(lastRun.timestamp) : '—'}</strong><small>${lastRun ? 'Most recent run' : 'Run the suite to populate'}</small></div></div><div class="panel"><div class="panel-heading"><div><h2>Latest results</h2><p>Each result comes from the browser test runner.</p></div><span class="score-chip ${results.length && s.failed === 0 ? 'good' : results.length ? 'bad' : ''}">${results.length ? (s.failed === 0 ? 'All tests passed' : 'Some tests failed') : 'Not run'}</span></div><div class="results-list">${resultRows(results)}</div></div>${runs.length ? `<div class="panel compact"><div class="panel-heading"><div><h2>Run history</h2><p>Up to the last 10 executions are kept locally.</p></div></div><div class="history-list">${runs.map(run => `<div class="history-row"><span>${formatDate(run.timestamp)}</span><span>${run.passed}/${run.passed + run.failed} passed</span><strong>${run.score}%</strong></div>`).join('')}</div></div>` : ''}<div class="small-link"><button class="text-button" data-route="test">Open interactive test surface →</button></div></section>`; }
function testPage() { const allPassed = results.length === TESTS.length && results.every(r => r.status === 'PASS'); const passed = results.filter(r => r.status === 'PASS').length; return `<section class="container page-stack">${pageHeader('Interactive lab', 'Test surface', 'Change state, refresh the browser, and run the checks against the live interface.')}<div class="test-layout"><div class="panel test-controls"><div class="control-section"><div class="section-label">01 · Counter</div><div class="counter-display" data-testid="counter-value">${counter}</div><div class="counter-actions"><button class="button ghost" data-action="dec">−</button><button class="button primary" data-action="inc">+1</button><button class="button ghost" data-action="reset">Reset</button></div></div><div class="control-section"><div class="section-label">02 · Text input</div><label class="field-label" for="text-input">Write something</label><input id="text-input" data-testid="text-input" class="text-input" value="${escapeHtml(text)}" placeholder="Type here…" /><div class="input-preview"><span>Live value</span><strong>${escapeHtml(text || 'Nothing entered yet')}</strong></div></div><div class="control-section theme-control"><div><div class="section-label">03 · Theme control</div><p>Current theme: <strong>${theme}</strong></p></div><button class="button ghost" data-action="theme">Switch to ${theme === 'dark' ? 'light' : 'dark'}</button></div><div class="control-section reset-strip"><div><div class="section-label">State reset</div><p>Clear the demo values stored in this browser.</p></div><button class="text-button" data-action="reset">Reset state</button></div></div><div class="panel test-runner"><div class="panel-heading"><div><div class="section-label">04 · Automated checks</div><h2>Run the suite</h2><p>Client-side checks execute against the current application.</p></div><button class="button primary" data-action="run" ${running ? 'disabled' : ''}>${running ? 'Running…' : 'Run Test'}</button>
