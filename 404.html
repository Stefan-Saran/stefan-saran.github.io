<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Veil</title>
  <style>
    html,body{margin:0;min-height:100%;background:#060807;color:#f3f7f1}
    body{display:grid;place-items:center;font:16px system-ui,sans-serif}
  </style>
</head>
<body>
  <div>Loading Veil…</div>
  <script>
  (async function(){
    const target = "/veil/index.html";
    try{
      const res = await fetch(target, {cache:"no-store"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const html = await res.text();
      history.replaceState({}, "", "/Veil-Environmental-Intelligence/" + location.search + location.hash);
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.body.innerHTML =
        "<div style='padding:32px;font-family:system-ui,sans-serif'>"
        +"<h1>Veil</h1><p>Unable to load the experience.</p>"
        +"<p><a href='/veil/'>Open Veil directly</a></p></div>";
    }
  })();
  </script>
</body>
</html>
